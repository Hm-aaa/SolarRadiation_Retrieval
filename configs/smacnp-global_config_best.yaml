# ==============================================================================
# SMACNP Global Configuration
# Hyperparams: r_dim=128, w_dim=64, v_dim=256, num_heads=16, hidden_size=512,
#              num_layers_mlp=2, dropout_rate=0.1, use_layer_norm=false,
#              smacnp_lr=0.000492630019468611, laplace_distance_p=1.0
# ==============================================================================

project:
  seed: 42

data:
  source_weather_path_all: "data/source_data/tavg_prec_2020_2023.parquet"
  processed_dir_all: "data/daily_all"
  dem_crs: "EPSG:3844"
  country_border_path: "data/borders/rou_border.gpkg"

outputs:
  checkpoints: "outputs/checkpoints"
  predictions: "outputs/predictions"
  plots: "outputs/plots"

model:
  type: "SMACNP"

  # ============================================================================
  # SMACNP CONFIGURATION
  # ============================================================================
  smacnp:
    # ==========================================================================
    # CONFIGURATION SELECTION
    # ==========================================================================
    configuration: 'global'  # Using trial #946 settings

    # --------------------------------------------------------------------------
    # DATA & DIMENSION CONFIGURATION
    # --------------------------------------------------------------------------
    input_dim: 10 # This value is not in the provided trial data, keeping it as is.
    spatial_dim: 2
    attr_dim: 8
    y_dim: 2
    spatial_indices: [0, 1]

    # --------------------------------------------------------------------------
    # GENERAL MODEL ARCHITECTURE
    # --------------------------------------------------------------------------
    r_dim: 128
    w_dim: 64
    v_dim: 256
    hidden_size: 512
    num_layers_mlp: 2
    num_heads: 16
    
    # --------------------------------------------------------------------------
    # REGULARIZATION
    # --------------------------------------------------------------------------
    dropout_rate: 0.1
    # Encoder/decoder MLPs remain shallow (2 layers) per Bao et al. (2024)

    # --------------------------------------------------------------------------
    # LAYER NORMALIZATION
    # --------------------------------------------------------------------------
    use_layer_norm: false
    
    # --------------------------------------------------------------------------
    # LAPLACE ATTENTION DISTANCE
    # --------------------------------------------------------------------------
    laplace_distance_p: 1.0

    # -------------------------------------------------------------------------- # From trial #136
    # VARIANCE FLOORS
    # --------------------------------------------------------------------------
    temp_variance_floor: 2.0e-4
    precip_variance_floor: 2.0e-2
    
# ==============================================================================
# TRAINING CONFIGURATION (Trial #946)
# ==============================================================================
training:
  # ----------------------------------------------------------------------------
  # Basic Settings
  # ----------------------------------------------------------------------------
  batch_size: 64
  use_mixed_precision: true
  num_epochs: 5000

  # ----------------------------------------------------------------------------
  # Learning Rate (Trial #10)
  # ----------------------------------------------------------------------------
  smacnp_lr: 0.000492630019468611
  # Recommendations by depth:
  # - 2 layers: 1e-4 to 5e-4 ← YOUR CASE (2.0e-4 is good)
  # - 4 layers: 5e-5 to 2e-4
  # - 6 layers: 1e-5 to 5e-5
  
  # ----------------------------------------------------------------------------
  # Optimizer (AdamW recommended for LayerNorm)
  # ----------------------------------------------------------------------------
  optimizer:
    name: 'AdamW'  # CHANGED: Adam → AdamW (better with LayerNorm)
    weight_decay: 1e-5 # Matches tuning base config (tuned value not used during training)
  
  # ----------------------------------------------------------------------------
  # Gradient Clipping (Adjusted for LayerNorm)
  # ----------------------------------------------------------------------------
  clip_grad_norm: 1.0  # CHANGED: 5.0 → 1.0 (LayerNorm stabilizes gradients)
  # Note: With LayerNorm, gradients are more stable, so lower clipping is sufficient
  
  # ----------------------------------------------------------------------------
  # Context Sampling
  # ----------------------------------------------------------------------------
  context_fraction_train: 0.5
  on_grid_training: true
  
  # ----------------------------------------------------------------------------
  # Loss Configuration
  # ----------------------------------------------------------------------------
  precip_distribution: "lognormal"
  
  loss_weights:
    temp: 1.0
    precip_prob: 1.0
    precip_amount: 1.0
  
  # ----------------------------------------------------------------------------
  # Learning Rate Scheduler
  # ----------------------------------------------------------------------------
  scheduler:
    name: ReduceLROnPlateau
    factor: 0.7
    patience: 50
    min_lr: 1e-6
    # Note: For deeper networks (4+ layers), consider CosineAnnealingWarmRestarts
    # with warmup_epochs: 5-10
  
  # ----------------------------------------------------------------------------
  # Early Stopping
  # ----------------------------------------------------------------------------
  early_stopping:
    patience: 200
    min_delta: 1e-5

# ==============================================================================
# PREDICTION CONFIGURATION
# ==============================================================================
prediction:
  batch_size: 8192
